server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: blackbeltbot-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54322/postgres?sslmode=disable}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
